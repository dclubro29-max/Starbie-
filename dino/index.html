<!DOCTYPE html>
<html lang="ro"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Starbie Dino Dash</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#101827;color:white;font-family:system-ui,Arial;display:grid;place-items:center;min-height:100vh}main{width:min(960px,96vw)}h1{margin:8px 0}p{color:#cbd5e1}canvas{width:100%;background:#80cfff;border-radius:18px;box-shadow:0 18px 50px #0008;touch-action:manipulation}small{color:#cbd5e1}
</style></head><body><main><h1>🦖 Starbie Dino Dash</h1><p>Apasă <b>SPACE</b> pentru a sări. Atât! Pe telefon, atinge jocul.</p><canvas id="game" width="900" height="360"></canvas><p id="hint">SPACE = start / salt / restart</p></main>
<script>
const canvas=document.querySelector('#game'),ctx=canvas.getContext('2d'),W=900,H=360,ground=295;
let state='ready',score=0,best=0,speed=6,obstacles=[],clouds=[],stars=[],time=0,spawn=90;
const dino={x:105,y:ground-52,w:44,h:52,vy:0};
function reset(){state='playing';score=0;speed=6;obstacles=[];clouds=[{x:150,y:55},{x:530,y:95},{x:800,y:50}];stars=[];time=0;spawn=75;dino.y=ground-dino.h;dino.vy=0;}
function jump(){if(state!=='playing'){reset();return;}if(dino.y>=ground-dino.h-1){dino.vy=-14.4;}}
addEventListener('keydown',e=>{if(e.code==='Space'){e.preventDefault();if(!e.repeat)jump();}});
canvas.addEventListener('pointerdown',jump);
function rounded(x,y,w,h,r,c){ctx.fillStyle=c;ctx.beginPath();ctx.roundRect(x,y,w,h,r);ctx.fill();}
function cloud(x,y){ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(x,y+15,18,0,7);ctx.arc(x+24,y+4,24,0,7);ctx.arc(x+51,y+17,17,0,7);ctx.fill();}
function drawDino(){const x=dino.x,y=dino.y;rounded(x+8,y+19,30,27,7,'#24a855');rounded(x+23,y,26,27,6,'#2dc96b');rounded(x+43,y+17,10,7,2,'#198949');rounded(x,y+29,16,10,4,'#1b934b');rounded(x+28,y+8,5,5,2,'#11263c');rounded(x+11,y+43,7,9,2,'#116e38');rounded(x+29,y+43,7,9,2,'#116e38');}
function drawObstacle(o){if(o.kind==='cactus'){rounded(o.x+11,ground-o.h,17,o.h,5,'#167c42');rounded(o.x+1,ground-o.h+15,13,10,4,'#21a85a');rounded(o.x+27,ground-o.h+24,13,9,4,'#21a85a');}else if(o.kind==='rock'){rounded(o.x,ground-o.h,o.w,o.h,13,'#64748b');rounded(o.x+8,ground-o.h+6,15,8,5,'#94a3b8');}else{rounded(o.x,ground-o.h,o.w,o.h,4,'#b86b38');rounded(o.x+6,ground-o.h+6,o.w-12,o.h-12,2,'#d99452');ctx.strokeStyle='#784022';ctx.lineWidth=5;ctx.beginPath();ctx.moveTo(o.x+8,ground-o.h+8);ctx.lineTo(o.x+o.w-8,ground-8);ctx.stroke();}}
function update(dt){if(state!=='playing')return;const f=Math.min(dt/16.667,2);time+=f;speed=Math.min(15,6+score/280);score+=f*.13;dino.vy+=.78*f;dino.y+=dino.vy*f;if(dino.y>ground-dino.h){dino.y=ground-dino.h;dino.vy=0;}spawn-=f;if(spawn<=0){let kind=['cactus','rock','crate'][Math.floor(Math.random()*3)];obstacles.push({x:W+25,w:kind==='rock'?47:39,h:kind==='cactus'?60:kind==='crate'?45:32,kind});spawn=Math.max(43,92-speed*2)+Math.random()*30;}for(const o of obstacles)o.x-=speed*f;obstacles=obstacles.filter(o=>o.x+o.w>0);for(const o of obstacles){if(dino.x+9<o.x+o.w-7&&dino.x+dino.w-8>o.x+7&&dino.y+9<ground&&dino.y+dino.h-4>ground-o.h+5){state='over';best=Math.max(best,Math.floor(score));}}for(const c of clouds){c.x-=.5*f;if(c.x<-80)c.x=W+100;}}
function draw(){let sky=ctx.createLinearGradient(0,0,0,ground);sky.addColorStop(0,'#70c6ff');sky.addColorStop(1,'#d7f2ff');ctx.fillStyle=sky;ctx.fillRect(0,0,W,H);ctx.fillStyle='#ffe184';ctx.beginPath();ctx.arc(760,70,30,0,7);ctx.fill();clouds.forEach(c=>cloud(c.x,c.y));ctx.fillStyle='#8bd480';ctx.fillRect(0,ground,W,65);ctx.fillStyle='#56b66a';ctx.fillRect(0,ground,W,8);ctx.fillStyle='#488f5a';for(let i=0;i<25;i++)ctx.fillRect((i*59-time*speed*.3)%(W+60),ground+25,15,3);obstacles.forEach(drawObstacle);drawDino();ctx.fillStyle='#18364e';ctx.font='bold 24px system-ui';ctx.fillText('SCORE '+Math.floor(score),22,40);ctx.fillText('BEST '+best,700,40);if(state!=='playing'){ctx.fillStyle='#10233bcc';ctx.fillRect(0,0,W,H);ctx.fillStyle='#fff';ctx.textAlign='center';ctx.font='bold 42px system-ui';ctx.fillText(state==='ready'?'STARBIE DINO DASH':'GAME OVER',W/2,150);ctx.font='22px system-ui';ctx.fillText('SPACE pentru '+(state==='ready'?'a începe':'restart'),W/2,200);ctx.textAlign='left';}}
let prev=performance.now();function frame(now){update(now-prev);draw();prev=now;requestAnimationFrame(frame);}requestAnimationFrame(frame);
</script></body></html>
